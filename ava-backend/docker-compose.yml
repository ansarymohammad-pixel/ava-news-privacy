services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ava
      POSTGRES_USER: ava
      POSTGRES_PASSWORD: ava
    ports:
      - "5432:5432"
    volumes:
      - ava_postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  ava_postgres:
